<script>
  /* Light is the default theme; dark uses the intro's exact palette. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ivory: 'rgb(var(--rgb-cream) / <alpha-value>)',
          navy: 'rgb(var(--rgb-text) / <alpha-value>)',
          ink: 'rgb(var(--rgb-text) / <alpha-value>)',
          mutedink: 'rgb(var(--rgb-soft) / <alpha-value>)',
          gold: 'rgb(var(--rgb-gold) / <alpha-value>)',
          goldsoft: 'rgb(var(--rgb-goldlight) / <alpha-value>)',
          golddark: 'rgb(var(--rgb-golddark) / <alpha-value>)',
          softline: 'rgb(var(--rgb-line) / <alpha-value>)',
          panel: 'rgb(var(--rgb-panel) / <alpha-value>)',
          onpanel: 'rgb(var(--rgb-onpanel) / <alpha-value>)',
          white: 'rgb(var(--rgb-surface) / <alpha-value>)'
        },
        fontFamily: { serif: ['"EB Garamond"', 'ui-serif', 'Georgia', 'serif'] }
      }
    }
  };

<style>
/* ============================ THEME TOKENS ================================
   Values come straight from pixelintro.html: :root is the light theme and
   body.theme-dark is the dark theme. The RGB channels keep Tailwind's opacity
   modifiers (bg-white/75, text-navy/70 …) working in both themes.
   ========================================================================= */
:root{
  --px-gold:#C5A059;--px-gold-light:#D9BE7E;--px-gold-dark:#947239;
  --px-navy:#0F172A;--px-navy-2:#1E3A8A;
  --px-cream:#FDFBF7;--px-bg-2:#F7F3EA;--px-surface:#FFFFFF;
  --px-text:#171717;--px-text-soft:#414141;--px-accent-blue:#1E3A8A;
  --px-like-bg:rgba(253,251,247,.95);--px-video-bg:#000;
  --px-title-3d:0 1px 1px rgba(0,0,0,.15);
  --rgb-cream:253 251 247;--rgb-surface:255 255 255;--rgb-text:23 23 23;--rgb-soft:65 65 65;
  --rgb-gold:197 160 89;--rgb-goldlight:217 190 126;--rgb-golddark:148 114 57;
  --rgb-line:231 223 210;--rgb-panel:29 35 49;--rgb-onpanel:250 247 242;
}
body.theme-dark{
  --px-cream:#000;--px-bg-2:#000;--px-surface:#141414;
  --px-text:#F5F1E8;--px-text-soft:#D8D3C9;--px-accent-blue:#B4C4F1;
  --px-gold-dark:#D9BE7E;--px-like-bg:rgba(20,20,20,.95);
  --px-title-3d:0 1px 1px rgba(0,0,0,.4);
  --rgb-cream:0 0 0;--rgb-surface:20 20 20;--rgb-text:245 241 232;--rgb-soft:216 211 201;
  --rgb-gold:217 190 126;--rgb-goldlight:232 209 155;--rgb-golddark:217 190 126;
  --rgb-line:40 40 40;--rgb-panel:20 20 20;--rgb-onpanel:245 241 232;
}
*{margin:0;padding:0;box-sizing:border-box}
body,button{font-family:'EB Garamond',Georgia,serif;font-weight:600;letter-spacing:.01em}
body{overflow-x:hidden;background:var(--px-cream);color:var(--px-text);transition:background .25s,color .25s}
html{font-size:17px;scroll-padding-top:88px}
h1,h2,h3,h4,h5{font-family:'EB Garamond',ui-serif,Georgia,serif;text-shadow:var(--px-title-3d)}
button{line-height:1.2;cursor:pointer}
button:focus-visible{outline:2px solid var(--px-text);outline-offset:4px}
.hidden{display:none!important}
/* Uniform letter spacing across every text block — no stretched letters */
[class*="tracking-"]{letter-spacing:.015em!important}
.num{font-variant-numeric:tabular-nums}
.gold-text{background:linear-gradient(100deg,#BF8E4B 0%,#E0B877 45%,#A97A3C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.theme-dark .gold-text{background:linear-gradient(100deg,#D9BE7E 0%,#F0DCA9 45%,#C5A059 100%);-webkit-background-clip:text;background-clip:text}
.glass-card{background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(250,247,242,.86));backdrop-filter:blur(14px);border:1px solid rgba(191,142,75,.22);box-shadow:0 18px 45px -28px rgba(29,35,49,.35)}
body.theme-dark .glass-card{background:linear-gradient(150deg,rgba(20,20,20,.92),rgba(10,10,10,.86));border-color:rgba(217,190,126,.28)}
.scroll-hide::-webkit-scrollbar{display:none}
.scroll-hide{scrollbar-width:none}
@keyframes marquee-x{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-track{animation:marquee-x 60s linear infinite;will-change:transform}
.marquee-track:hover{animation-play-state:paused}
@keyframes float-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float-soft{animation:float-soft 6s ease-in-out infinite}

/* ======================= INTRO PAGE (verbatim) ========================== */
.top-controls{position:fixed;top:24px;right:24px;z-index:999;display:flex;align-items:center;gap:12px;opacity:1;pointer-events:auto}
.skip-btn{padding:10px 20px;background:var(--px-surface);border:1px solid var(--px-gold);border-radius:100px;color:var(--px-text);font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;opacity:1}
.skip-btn svg{width:16px;height:16px;flex:none}
.theme-toggle{width:42px;height:42px;flex:none;border-radius:50%;background:var(--px-surface);border:1px solid var(--px-gold);display:inline-flex;align-items:center;justify-content:center;color:var(--px-text)}
.theme-toggle svg{width:19px;height:19px}
.theme-toggle .icon-moon{display:none}
body.theme-dark .theme-toggle .icon-moon{display:block}
body.theme-dark .theme-toggle .icon-sun{display:none}
#intro-screen{position:fixed;inset:0;z-index:9000;background:var(--px-cream)}
.bg-decoration{position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--px-cream)}
.viewport{perspective:1000px;perspective-origin:50% 45%;height:100vh;width:100%;position:relative;overflow:hidden;z-index:1}
#gallery,#showcase-container{position:absolute;inset:0;transform-style:preserve-3d}
#showcase-container{z-index:10}
.px-card{position:absolute;top:50%;left:50%;width:130px;height:185px;margin-top:-92px;margin-left:-65px;padding:3px;background:#fff;border-radius:10px;overflow:hidden;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform,opacity;opacity:0}
.px-card img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.showcase-card{position:absolute;top:50%;left:50%;width:240px;height:339px;margin-top:-169px;margin-left:-120px;padding:8px;background:var(--px-surface);border-radius:18px;overflow:hidden;backface-visibility:hidden;border:1px solid var(--px-gold);opacity:0;z-index:10;will-change:transform,opacity}
.showcase-card img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
.showcase-logo-card{position:absolute;top:50%;left:50%;width:180px;height:180px;margin-top:-90px;margin-left:-90px;opacity:0;z-index:10;will-change:transform,opacity}
.showcase-logo-circle{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--px-gold);overflow:hidden;background:var(--px-surface)}
.showcase-logo-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.showcase-text{position:absolute;top:max(100px,12%);left:50%;transform:translateX(-50%);width:85%;font-size:1.7rem;color:var(--px-text);text-align:center;z-index:15;opacity:0;line-height:1.35;text-shadow:var(--px-title-3d)}
.showcase-text .accent,.hero-title .accent{color:var(--px-gold)}
.logo-center{position:absolute;top:50%;left:50%;z-index:5;opacity:0}
.logo-circle{width:75px;height:75px;border-radius:50%;background:var(--px-surface);display:flex;align-items:center;justify-content:center;border:2px solid var(--px-gold);overflow:hidden;position:relative;z-index:5}
.logo-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.logo-ring{position:absolute;top:50%;left:50%;border-radius:50%;pointer-events:none}
.logo-ring-1{width:95px;height:95px;border:2px dashed var(--px-gold)}
.logo-ring-2{width:115px;height:115px;border:1px solid var(--px-gold)}
.logo-ring-3{width:135px;height:135px;border:1px dotted var(--px-gold)}
.phase-text{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);width:90%;font-size:1rem;color:var(--px-text-soft);letter-spacing:.03em;text-transform:uppercase;text-align:center;z-index:20;opacity:0}
.progress-container{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:180px;height:2px;background:var(--px-surface);overflow:hidden;z-index:20}
.progress-fill{height:100%;width:0%;background:var(--px-gold)}
.hero-stage{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,430px);grid-template-rows:auto auto auto;grid-template-areas:"content video" "campaign video" "credit credit";align-content:safe center;justify-content:center;column-gap:clamp(32px,5vw,72px);row-gap:32px;padding:88px clamp(24px,6vw,80px) 48px;overflow-y:auto;overflow-x:hidden;background:var(--px-cream);opacity:0;pointer-events:none}
.hero-content{grid-area:content;display:flex;flex-direction:column;align-items:center;max-width:680px;justify-self:center;width:100%;text-align:center}
.hero-title{font-size:clamp(3rem,5.8vw,5rem);color:var(--px-text);margin-bottom:12px;opacity:0;line-height:1.1;text-shadow:var(--px-title-3d)}
.hero-tagline{font-style:italic;font-size:1.6rem;color:var(--px-gold-dark);margin-bottom:26px;opacity:0;line-height:1.35}
.typing-container{min-height:96px;display:flex;align-items:flex-start;justify-content:center;max-width:640px}
.typing-text{font-size:1.3rem;color:var(--px-text-soft);text-align:center;line-height:1.55;opacity:0}
.typing-text.typing::after{content:'|';color:var(--px-gold);animation:blink .7s infinite;margin-left:1px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.hero-badge{margin-top:24px;padding:9px 24px;background:var(--px-surface);border:1px solid var(--px-gold);border-radius:100px;font-size:1rem;color:var(--px-gold-dark);letter-spacing:.03em;opacity:0;text-transform:uppercase}
.enter-btn{margin-top:28px;padding:17px 36px;background:var(--px-gold-light);color:var(--px-navy);border:1px solid var(--px-gold);border-radius:14px;font-size:1.25rem;display:inline-flex;align-items:center;gap:12px;opacity:0;pointer-events:auto}
.enter-btn svg{width:20px;height:20px;flex:none}
.campaign-footnote{grid-area:campaign;max-width:720px;width:100%;text-align:center;font-size:1.15rem;color:var(--px-text);line-height:1.55;opacity:0;padding:20px 26px;background:var(--px-surface);border:1px solid var(--px-gold);border-radius:16px;justify-self:center}
.campaign-footnote strong{color:var(--px-accent-blue);font-weight:600}
.campaign-footnote .vote{color:var(--px-gold-dark);font-weight:600}
.hero-video-card{grid-area:video;position:relative;align-self:center;justify-self:center;width:min(340px,84vw);padding:10px;background:var(--px-surface);border-radius:18px;overflow:hidden;opacity:0;border:2px solid var(--px-gold)}
.hero-video-card video{width:100%;height:auto;aspect-ratio:9/16;object-fit:contain;border-radius:10px;display:block;background:var(--px-video-bg)}
.like-btn{position:absolute;right:16px;bottom:16px;z-index:5;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:var(--px-like-bg);border:1px solid var(--px-gold);border-radius:100px;color:var(--px-text);font-size:1rem}
.like-btn svg{width:17px;height:17px;stroke:var(--px-gold-dark);fill:none}
.like-btn.liked svg{fill:var(--px-gold);stroke:var(--px-gold-dark)}
.hero-scroll-btn{grid-area:scroll;display:none;flex:none;align-self:center;justify-self:center;width:46px;height:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;border:1px solid var(--px-gold);background:var(--px-surface);align-items:center;justify-content:center;color:var(--px-gold-dark);animation:scrollNudge 1.6s ease-in-out infinite}
.hero-scroll-btn svg{width:20px;height:20px;flex:none}
@keyframes scrollNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(max-width:900px){
  .top-controls{top:16px;right:16px}
  .skip-btn{padding:8px 16px;font-size:1rem}
  .theme-toggle{width:38px;height:38px}
  .px-card{width:95px;height:135px;margin-top:-67px;margin-left:-47px}
  .showcase-card{width:210px;height:297px;margin-top:-148px;margin-left:-105px}
  .showcase-logo-card{width:150px;height:150px;margin-top:-75px;margin-left:-75px}
  .showcase-text{font-size:1.25rem;top:max(96px,16%);width:88%}
  .hero-stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:36px;padding:88px 20px max(48px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .hero-stage>*{flex-shrink:0}
  .hero-content{max-width:100%}
  .hero-title{font-size:3rem}
  .hero-tagline{font-size:1.4rem;margin-bottom:22px}
  .typing-container{min-height:0;width:100%}
  .typing-text{font-size:1.2rem;line-height:1.6}
  .hero-badge{font-size:.95rem;padding:8px 16px}
  .enter-btn{font-size:1.2rem;padding:15px 26px;margin-top:24px}
  .hero-scroll-btn{display:inline-flex}
  .hero-video-card{width:80%;max-width:380px;aspect-ratio:9/16;flex:none;padding:0;border:0;background:transparent;border-radius:18px;order:0}
  .hero-video-card video{width:100%;height:100%;aspect-ratio:9/16;object-fit:contain;border-radius:18px}
  .campaign-footnote{font-size:1.1rem;padding:20px;max-width:480px}
  #intro-screen{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .viewport{perspective:600px;height:100svh;min-height:540px}
  .progress-container{width:140px;bottom:max(24px,env(safe-area-inset-bottom))}
  .phase-text{font-size:.95rem;bottom:calc(48px + env(safe-area-inset-bottom));line-height:1.35}
  .hero-stage{height:100%;height:100dvh}
}
/* Credit badge — very last block of the intro hero stage, centred */
.hero-credit{grid-area:credit;justify-self:center;align-self:end;width:100%;max-width:520px;text-align:center;opacity:0;padding:18px 22px;background:var(--px-surface);border:1px solid var(--px-gold);border-radius:16px}
.hero-credit-name{font-size:1.15rem;color:var(--px-text)}
.hero-credit-btn{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:100px;border:1px solid var(--px-gold);background:var(--px-gold-light);color:var(--px-navy);font-size:1rem;font-weight:600;text-decoration:none}
.hero-credit-btn:hover{filter:brightness(1.06)}

/* Dark theme only: both logos sit on a white curved frame */
body.theme-dark .logo-chip{background:#fff;border:1px solid rgba(197,160,89,.35);border-radius:14px;padding:6px 10px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
body.theme-dark .logo-circle,body.theme-dark .showcase-logo-circle{background:#fff}

/* The landing cards keep their light artwork in both themes, so their text
   stays dark and readable inside the card in the dark theme as well. */
body.theme-dark .edition-card h3,
body.theme-dark .edition-card p,
body.theme-dark .edition-card .card-eyebrow{color:#1c1c1c;font-weight:600}

@media (prefers-reduced-motion: reduce){.marquee-track,.float-soft{animation:none}}
</style>

<script>
/* ============================================================================
   PIXELS 2k26 — complete single-file application
   HTML5 + Tailwind (CDN) + CSS3 + vanilla JS. No build step.
   The animated intro page (ported verbatim from pixelintro.html) plays first;
   the Enter PIXELS 2k26 button reveals the landing page.

   ---------------------------------------------------------------------------
   FIREBASE / SUPABASE
   ---------------------------------------------------------------------------
   Everything reads and writes through `DB`, which delegates to `adapter`.
   Only four methods are needed, each returning objects with an `id`:

       adapter.list(collection)                -> Promise<Array>
       adapter.create(collection, data)        -> Promise<Object>
       adapter.update(collection, id, patch)   -> Promise<Object>
       adapter.remove(collection, id)          -> Promise<void>

   Collections: teams, categories, events, members, registrations, results,
                announcements, posts, config

   Supabase example:
       const supabase = window.supabase.createClient(URL, ANON_KEY);
       const SupabaseAdapter = {
         async list(c)              { const { data } = await supabase.from(c).select('*'); return data || []; },
         async create(c, d)         { const { data } = await supabase.from(c).insert(d).select().single(); return data; },
         async update(c, id, patch) { const { data } = await supabase.from(c).update(patch).eq('id', id).select().single(); return data; },
         async remove(c, id)        { await supabase.from(c).delete().eq('id', id); }
       };

   Firestore example:
       const FirestoreAdapter = {
         async list(c)              { const s = await getDocs(collection(db, c)); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
         async create(c, d)         { const r = await addDoc(collection(db, c), d); return { id: r.id, ...d }; },
         async update(c, id, patch) { await updateDoc(doc(db, c, id), patch); return { id, ...patch }; },
         async remove(c, id)        { await deleteDoc(doc(db, c, id)); }
       };

   Then set:  const adapter = SupabaseAdapter;      // (or FirestoreAdapter)

   Small device-level values (the hero like counter, local flags) go through the
   two-method `KV` store — swapped just as easily:
       const SupabaseKV = {
         async get(k, f) { const { data } = await supabase.from('meta').select('value').eq('key', k).maybeSingle(); return data ? data.value : f; },
         async set(k, v) { await supabase.from('meta').upsert({ key: k, value: v }); return v; }
       };

   File uploads go through `uploader` — swap it for Firebase/Supabase Storage:
       const SupabaseStorage = {
         async upload(file) {
           const path = 'pixels/' + Date.now() + '-' + file.name;
           await supabase.storage.from('pixels').upload(path, file);
           return supabase.storage.from('pixels').getPublicUrl(path).data.publicUrl;
         }
       };
   ========================================================================== */

/* ============================== 1. ASSETS ================================= */
const A = {
  logo:      'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/d312e3b0f_pixels.png',
  college:   'https://media.base44.com/images/public/user_695a0eedac0f335ac1c4d2a0/3713e7da6_image.png',
  revan:     'https://media.base44.com/images/public/user_695a0eedac0f335ac1c4d2a0/0c82acc04_image.png',
  heroVideo: 'https://media.base44.com/videos/public/6ac190b2672265dcfbb64804/4f190a11f_WhatsAppVideo2026-10-04at10716PM.mp4',
  filmVideo: 'https://media.base44.com/videos/public/6ac190b2672265dcfbb64804/094929de1_WhatsAppVideo2026-10-04at83144PM.mp4',
  ctaVideo:  'https://media.base44.com/videos/public/user_695a0eedac0f335ac1c4d2a0/880199ba6_WhatsAppVideo2026-10-04at40724AM.mp4',
  cream:     'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/4e1664d52_image.png',
  cricket:   'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/bfb8dc0ec_image.png',
  bgmi:      'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/59e54847b_image.png',
  festival:  'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/006fbb18a_image.png',
  ai:        'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/4fd65a637_image.png',
  leaderboard:'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/ca5daebd1_image.png',
  lock:      'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/52b0a02c5_image.png',
  howCard:   'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/c1c5445a0_image.png',
  editionCard:'https://media.base44.com/images/public/6ac190b2672265dcfbb64804/7f6772fcd_WhatsAppImage2026-10-05at105001AM.jpeg',
  hackathon: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900&q=80',
  memories:  'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=900&q=80',
  live:      'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=900&q=80',
  campus:    'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=900&q=80',
  sports:    'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=900&q=80'
};
const LINKEDIN = 'https://www.linkedin.com/in/syed-numan-pasha-114b212bb?utm_source=share_via&utm_content=profile&utm_medium=member_android';
const EVENT_QUOTA = '35+';
const TOTAL_POINTS = 1200;
const APP_URL = 'pixels-event-flow.base44.app';
/* The Install-the-app button downloads this Android build directly. */

/* ========================= 2. DATABASE ADAPTER ============================ */
const KEYS = { db: 'pixel2k26_db', admin: 'pixel2k26_admin', captain: 'pixel2k26_captain', student: 'pixel2k26_student', theme: 'pixels2k26_theme', intro: 'pixels2k26_intro_entered' };
const COLLECTIONS = ['teams','categories','events','members','registrations','results','announcements','posts','config'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const readRaw = () => { try { return JSON.parse(localStorage.getItem(KEYS.db) || '{}'); } catch { return {}; } };

const LocalAdapter = {
  async list(c) { return (readRaw()[c] || []).slice(); },
  async create(c, data) {
    const all = readRaw(); all[c] = all[c] || [];
    const row = { id: uid(), created_date: new Date().toISOString(), ...data };
    all[c].push(row); localStorage.setItem(KEYS.db, JSON.stringify(all)); return row;
  },
  async update(c, id, patch) {
    const all = readRaw(); all[c] = all[c] || [];
    const i = all[c].findIndex(r => r.id === id);
    if (i < 0) return null;
    all[c][i] = { ...all[c][i], ...patch, id };
    localStorage.setItem(KEYS.db, JSON.stringify(all)); return all[c][i];
  },
  async remove(c, id) {
    const all = readRaw(); all[c] = (all[c] || []).filter(r => r.id !== id);
    localStorage.setItem(KEYS.db, JSON.stringify(all));
  }
};

/* Swap this single line to move the whole app onto Firebase/Supabase. */
const adapter = LocalAdapter;

/* Small device-level values (the hero like counter, local flags). Two methods
   only, so it can be pointed at Firebase/Supabase exactly like `adapter`. */
const KV = {
  async get(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
    catch (e) { return fallback; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    return value;
  }
};

const DB = {
  list: (c) => adapter.list(c),
  create: (c, d) => adapter.create(c, d),
  update: (c, id, p) => adapter.update(c, id, p),
  remove: (c, id) => adapter.remove(c, id),
  async all() {
    const pairs = await Promise.all(COLLECTIONS.map(c => DB.list(c)));
    const out = {}; COLLECTIONS.forEach((c, i) => { out[c] = pairs[i]; }); return out;
  }
};

/* Uploads: default keeps the picture inside the browser. Replace with the
   SupabaseStorage / Firebase Storage snippet above for real object storage. */
const uploader = {
  async upload(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }
};

/* ============================= 7. DASHBOARD ============================= */
function dashboard() {
  const d = state.data, c = config();
  const ranked = standings();
  const live = d.events.filter(e => e.status === 'live');
  const upcoming = d.events.filter(e => e.status === 'upcoming');
  const participants = d.registrations.reduce((s, r) => s + num(r.participants_count || 1), 0);

  const eventCol = (title, list, emptyTitle) => '<div><div class="mb-4 flex items-center gap-2">' +
    '<h3 class="text-[15px] font-bold uppercase text-navy">' + title + '</h3>' +
    '<span class="num rounded-full bg-navy/10 px-2 py-0.5 text-[12px] font-bold text-navy/70">' + list.length + '</span></div>' +
    (list.length ? '<div class="grid gap-4 sm:grid-cols-2">' + list.slice(0, 6).map(e => eventCard(e)).join('') + '</div>'
      : empty(emptyTitle, 'Nothing has been scheduled so far — the president publishes events from the admin panel and they appear here instantly.')) + '</div>';

  return nav() + header('Open dashboard', esc(c.event_name || 'PIXELS 2k26') + ' Common Dashboard',
      'Live events, team standings, rosters, registrations, memories and every point on the board — open to the whole campus.',
      '<a href="#/journey" class="' + BTN.dark + '">' + icon('spark','h-4 w-4') + ' My PIXEL Journey</a><a href="#/captain" class="' + BTN.gold + '">Captain login</a><a href="#/admin" class="' + BTN.ghost + '">Admin / President</a>') +
  '<div class="mx-auto max-w-7xl space-y-16 px-5 py-12 lg:px-8 lg:py-16">' +
    '<div class="grid grid-cols-2 gap-4 lg:grid-cols-3 xl:grid-cols-6">' +
      tile('Total teams', d.teams.length) + tile('Total students', d.members.length) + tile('Total events', d.events.length) +
      tile('Points in play', pointsPossible() || TOTAL_POINTS) + tile('Live right now', live.length, true) + tile('Registrations', d.registrations.length) +
    '</div>' +
    '<a href="#/journey" class="glass-card flex flex-wrap items-center justify-between gap-5 rounded-[1.8rem] border border-gold/30 p-6 sm:p-7">' +
      '<div><p class="text-[12px] font-bold uppercase text-gold">My PIXEL Journey</p>' +
      '<p class="mt-2 text-lg font-bold text-navy sm:text-xl">Follow every event you entered, the points you scored and your team&rsquo;s progress.</p></div>' +
      '<span class="inline-flex shrink-0 items-center gap-2 rounded-full bg-panel px-5 py-3 text-[15px] font-semibold text-onpanel">' + icon('spark','h-4 w-4') + ' Open my journey</span>' +
    '</a>' +
    '<section class="space-y-10">' + eventCol('Live now', live, 'No events scheduled yet') + eventCol('Up next', upcoming, 'No events scheduled yet') +
      (d.events.length ? '<a href="#/events" class="' + BTN.ghost + '">See the complete schedule</a>' : '') + '</section>' +
    '<section class="grid gap-8 lg:grid-cols-[1.15fr_0.85fr]">' +
      card(section('Visual analytics','Where the points are landing','Live points tally across all four teams of PIXELS 2k26.') +
        '<div class="mt-6 space-y-4">' + (ranked.length ? ranked.map(t =>
          '<div><div class="flex items-center justify-between text-[14px] font-semibold text-navy"><span>' + esc(t.name) + '</span><span class="num">' + t.points + '</span></div>' +
          '<div class="mt-2 h-2.5 overflow-hidden rounded-full bg-navy/10"><div class="h-full rounded-full bg-gradient-to-r from-gold to-goldsoft" style="width:' + Math.min(100, (t.points / Math.max(1, ranked[0].points)) * 100) + '%"></div></div></div>').join('')
          : '<p class="text-[15px] text-mutedink">No team data yet.</p>') + '</div>') +
      '<div class="space-y-8">' + card(section('Point pool','Points by category') + '<div class="mt-5 space-y-3">' +
        (d.categories.filter(cat => d.events.some(e => e.category === cat.name)).map(cat =>
          '<div class="flex items-center justify-between text-[14px] text-navy/80"><span>' + esc(cat.icon || '•') + ' ' + esc(cat.name) + '</span><span class="num">' + d.events.filter(e => e.category === cat.name).length + ' events</span></div>').join('')
          || '<p class="text-[15px] text-mutedink">No events yet.</p>') + '</div>') +
        card(section('Standings','Team rankings') + '<div class="mt-5">' + standingsBlock(ranked) + '</div>') + '</div>' +
    '</section>' +
    '<section>' + section('Teams','The four teams of PIXELS 2k26','Captains, vice captains and current standings — tap a team for its full roster.') +
      '<div class="mt-6 grid gap-6 lg:grid-cols-[1fr_0.85fr]"><div class="grid gap-4 sm:grid-cols-2">' +
        d.teams.map(t => '<a href="#/teams/' + t.id + '" class="rounded-2xl border border-gold/25 bg-white/75 p-6 hover:-translate-y-1">' +
          '<p class="text-lg font-black text-navy">' + esc(t.name) + '</p>' +
          '<p class="mt-1.5 text-[12px] uppercase text-gold">' + esc(t.motto || 'Team of PIXELS 2k26') + '</p>' +
          '<div class="mt-5 space-y-1 text-[14px] text-navy/75"><p>Captain · ' + esc(t.captain_name || 'To be announced') + '</p>' +
          '<p>Vice captain · ' + esc(t.vice_captain_name || 'To be announced') + '</p>' +
          '<p class="num font-semibold text-navy">' + d.members.filter(m => m.team === t.name).length + ' members · ' + num(t.total_points) + ' pts</p></div></a>').join('') +
      '</div><div class="rounded-[1.8rem] border border-softline bg-white/70 p-6">' + section('Leader board','Team ranks') + '<div class="mt-5">' + standingsBlock(ranked) + '</div></div></div></section>' +
    '<section>' + section('Notice board','Announcements from the fest desk') + '<div class="mt-6 space-y-4">' +
      (d.announcements.length ? d.announcements.map(a => '<article class="rounded-2xl border border-softline bg-white/75 px-5 py-4">' +
        '<p class="text-[16px] font-bold text-navy">' + esc(a.title) + '</p><p class="mt-2 text-[15px] text-mutedink">' + esc(a.body) + '</p>' +
        '<p class="mt-2 text-[12px] uppercase text-mutedink">' + esc(a.author_name || 'Fest desk') + ' · ' + esc(a.category || 'General') + '</p></article>').join('')
        : empty('No announcements yet','The president and team captains post notices from their panels — everything they publish appears here instantly.')) +
    '</div></section>' +
    '<section>' + section('Participation','Who is in, who is yet to enter', d.members.length + ' students on the rosters · ' + participants + ' participants recorded across ' + d.registrations.length + ' registrations.') +
      (d.members.length ? '' : '<div class="mt-6">' + empty('No team members added yet','The president and captains add students to the teams first.') + '</div>') + '</section>' +
    registerBlock() +
    '<section>' + section('Memories','Latest from the PIXELS 2k26 album') + '<div class="mt-6">' +
      (d.posts.length ? '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">' + d.posts.slice(0, 8).map(p =>
        '<figure class="overflow-hidden rounded-2xl border border-softline bg-white/75"><img src="' + esc(p.image_url) + '" alt="" class="h-40 w-full object-cover" />' +
        '<figcaption class="px-4 py-3 text-[13px] text-mutedink">' + esc(p.caption || '') + ' · ' + esc(p.uploader_name) + '</figcaption></figure>').join('') + '</div>'
        : empty('Album is empty','Students upload their PIXEL moments from the Memories page — every photo lands in this strip.')) + '</div></section>' +
  '</div>' + campaignBlock() + footer() + tabbar();
}
function standingsBlock(ranked) {
  return '<div class="space-y-3">' + ranked.map(t => '<div class="flex items-center gap-4 rounded-2xl border border-softline bg-white/70 px-4 py-3">' +
    '<span class="num inline-flex h-8 w-8 items-center justify-center rounded-full bg-panel text-[13px] font-bold text-onpanel">' + t.rank + '</span>' +
    '<div class="min-w-0 flex-1"><p class="truncate text-[15px] font-bold text-navy">' + esc(t.name) + '</p>' +
    '<p class="text-[12px] uppercase text-mutedink">' + esc(t.captain_name || 'Captain to be announced') + '</p></div>' +
    '<span class="num text-lg font-black text-navy">' + t.points + '</span></div>').join('') + '</div>';
}
function eventCard(e) {
  return '<a href="#/events/' + e.id + '" class="block rounded-2xl border border-softline bg-white/75 p-5 hover:-translate-y-1">' +
    '<div class="flex items-center justify-between gap-3"><p class="text-[16px] font-bold text-navy">' + esc(e.name) + '</p>' +
    '<span class="rounded-full px-3 py-1 text-[11px] font-bold uppercase ' + statusPill(e.status) + '">' + esc(e.status) + '</span></div>' +
    '<p class="mt-2 text-[12px] uppercase text-mutedink">' + esc(e.category || '') + ' · ' + num(e.points) + ' pts</p>' +
    (e.venue ? '<p class="mt-2 text-[14px] text-mutedink">📍 ' + esc(e.venue) + (e.schedule ? ' · ' + esc(e.schedule) : '') + '</p>' : '') + '</a>';
}
function registerBlock() {
  const d = state.data, s = student();
  return '<section id="register">' + section('Participate','Register for your events','Enter your details and the events you are taking part in — coordinators see it instantly.') +
    '<form data-form="register" class="mt-6 rounded-[1.8rem] border border-gold/30 bg-white/75 p-6 sm:p-8"><div class="grid gap-5 sm:grid-cols-2">' +
      field('Student name','student_name','text',s.name,'Full name',true) +
      field('USN','usn','text',s.usn,'University registration number') +

function journey() {
  const d = state.data, s = student();
  const mine = d.registrations.filter(r => (s.usn && norm(r.usn) === norm(s.usn)) || (s.name && norm(r.student_name) === norm(s.name)));
  const rows = mine.map(r => {
    const ev = eventByName(r.event_name), res = resultByEvent(r.event_name);
    const team = r.team || s.team;
    let pts = 0, place = null;
    if (res && team) {
      if (norm(res.first_team) === norm(team)) { pts = num(ev && ev.points); place = '1st'; }
      else if (norm(res.second_team) === norm(team)) { pts = Math.round(num(ev && ev.points) * 0.5); place = '2nd'; }
      else if (norm(res.third_team) === norm(team)) { pts = Math.round(num(ev && ev.points) * 0.25); place = '3rd'; }
    }
    return { r, ev, pts, place, team };
  });
  const points = rows.reduce((a, b) => a + b.pts, 0);
  const teamRec = teamByName(s.team);
  const teamTotal = num(teamRec && teamRec.total_points);
  const share = teamTotal > 0 ? Math.round((points / teamTotal) * 100) : 0;
  const cats = [...new Set(rows.map(x => (x.ev && x.ev.category) || x.r.category).filter(Boolean))];

  return nav() + header('Personal track','My PIXEL Journey',
      s.name ? 'Every event, every point and every contribution ' + s.name + ' made for ' + (s.team || 'the team') + '.' : 'Set your student details once and follow every event you take part in across PIXELS 2k26.',
      '<a href="#/dashboard" class="' + BTN.ghost + '">Back to dashboard</a>') +
  '<div class="mx-auto max-w-6xl space-y-12 px-5 py-12 lg:px-8 lg:py-16">' +
    '<form data-form="student" class="rounded-[1.8rem] border border-gold/30 bg-white/75 p-6 sm:p-8">' +
      '<h2 class="text-lg font-bold text-navy">Your student identity</h2>' +
      '<p class="mt-2 text-[15px] text-mutedink">Enter your details once on this device — your journey tracks every event you register for.</p>' +
      '<div class="mt-6 grid gap-5 sm:grid-cols-3">' + field('Student name','name','text',s.name,'Full name',true) +
      field('USN','usn','text',s.usn,'University registration number') +
      selectField('Team','team', d.teams.map(t => t.name), s.team, 'Select your team') + '</div>' +
      '<div class="mt-6 flex items-center gap-4"><button class="' + BTN.gold + '" type="submit">Save my details</button>' +
      (state.flash ? '<span class="text-[15px] font-semibold text-gold">' + esc(state.flash) + '</span>' : '') + '</div></form>' +
    '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
      tile('Events participated', rows.length) + tile('Points scored for my team', points, true) +
      tile('Share of team points', share + '%') + tile((s.team || 'Team') + ' total points', teamTotal) + '</div>' +
    '<section>' + section('Participations','Events on my journey','Points shown are the value your team earned in each event you entered.') +
      '<div class="mt-6 space-y-3">' + (rows.length ? rows.map(x => '<article class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-softline bg-white/75 px-5 py-4">' +
        '<div class="min-w-0"><p class="truncate text-[16px] font-bold text-navy">' + esc(x.r.event_name) + '</p>' +
        '<p class="mt-1 text-[12px] uppercase text-mutedink">' + esc((x.ev && x.ev.category) || x.r.category || '—') + ' · ' + esc(x.team || '—') + '</p>' +
        '<p class="mt-2 text-[13px] text-mutedink">' + (x.ev && x.ev.venue ? '📍 ' + esc(x.ev.venue) + ' ' : '') + (x.ev && x.ev.schedule ? '· ' + esc(x.ev.schedule) : '') + '</p></div>' +
        '<div class="flex items-center gap-3"><span class="rounded-full px-3 py-1.5 text-[11px] font-bold uppercase ' + statusPill(x.ev ? x.ev.status : 'upcoming') + '">' + esc(x.ev ? x.ev.status : 'upcoming') + '</span>' +
        (x.place ? '<span class="rounded-full bg-gold px-3 py-1.5 text-[11px] font-bold uppercase text-panel">' + x.place + ' place</span>' : '') +
        '<span class="num text-lg font-black text-navy">' + x.pts + '</span></div></article>').join('')
        : empty('No events on your journey yet','Register for an event from the dashboard and it will appear here with the points your team earns.')) + '</div></section>' +
    (cats.length ? '<section>' + section('Spread','Where you competed') + '<div class="mt-5 flex flex-wrap gap-3">' +

const CAPTAIN_TABS = [['overview','Overview'],['members','Members'],['registrations','Registrations'],['notice','Team notice']];
function captain() {
  const team = teamByName(captainTeam());
  if (!team) return captainGate();
  const d = state.data, tab = state.captainTab || 'overview';
  const roster = d.members.filter(m => m.team === team.name);
  const regs = d.registrations.filter(r => norm(r.team) === norm(team.name));
  const ranked = standings();
  const me = ranked.find(t => t.name === team.name) || { points: 0, rank: ranked.length };

  const body =
    (tab === 'overview' ? '<div class="space-y-8"><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
      tile('Team', team.name) + tile('Team points', num(team.total_points), true) + tile('Rank', '#' + me.rank) + tile('Members', roster.length) + '</div>' +
      card(section('Leader board','Where every team stands') + '<div class="mt-5">' + standingsBlock(ranked) + '</div>') + '</div>' : '') +
    (tab === 'members' ? adminCard(team.name + ' roster (' + roster.length + ')', 'Confirmed members of your team. New students you add wait for the president to confirm.',
      '<form data-form="captainMember" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">' + field('Student name','name','text','','Full name',true) +
      field('USN','usn','text','','University registration number') + field('Year','year','text','','') + field('Branch','branch','text','','') +
      field('Phone','phone','text','','') + '<div class="lg:col-span-3"><button class="' + BTN.gold + '" type="submit">Add to my team</button></div></form>' +
      '<div class="mt-8 space-y-3">' + (roster.length ? roster.map(m => '<div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-softline bg-white/70 px-5 py-4">' +
        '<div><p class="text-[15px] font-semibold text-navy">' + esc(m.name) + '</p><p class="text-[12px] uppercase text-mutedink">' + esc(m.usn || '—') + ' · ' + esc(m.role || 'member') + '</p></div>' +
        '<span class="rounded-full px-2.5 py-1 text-[11px] font-bold uppercase ' + (m.status === 'pending' ? 'bg-gold/20 text-golddark' : 'bg-navy/10 text-navy/70') + '">' + esc(m.status || 'confirmed') + '</span></div>').join('')
        : empty('No roster yet','Add your first student above — the president confirms them.')) + '</div>') : '') +
    (tab === 'registrations' ? adminCard('Registrations (' + regs.length + ')', regs.length + ' entries from your team',
      regs.length ? '<div class="space-y-3">' + regs.map(r => '<div class="rounded-2xl border border-softline bg-white/70 px-5 py-4">' +
        '<p class="text-[15px] font-semibold text-navy">' + esc(r.student_name) + ' <span class="text-mutedink">· ' + esc(r.event_name) + '</span></p>' +
        '<p class="text-[12px] uppercase text-mutedink">' + esc(r.usn || '—') + ' · ' + num(r.participants_count || 1) + ' participant(s) · ' + esc(r.status || 'registered') + '</p></div>').join('') + '</div>'
        : empty('No registrations from your team yet','Students register from the dashboard — everything from your team shows up here.')) : '') +
    (tab === 'notice' ? adminCard('Post a team notice', 'Announcements you publish appear on the dashboard notice board with your name.',
      '<form data-form="captainNotice" class="grid gap-5 sm:grid-cols-2">' + field('Title','title','text','','Team update',true) +
      field('Category','category','text','General','General / Sports / Cultural') +
      areaField('Message','body','','What should your team know?','sm:col-span-2') +
      '<div class="sm:col-span-2"><button class="' + BTN.gold + '" type="submit">Publish notice</button></div></form>' +
      '<div class="mt-8 space-y-3">' + (d.announcements.filter(a => norm(a.team) === norm(team.name)).length
        ? d.announcements.filter(a => norm(a.team) === norm(team.name)).map(a => '<div class="rounded-2xl border border-softline bg-white/70 px-5 py-4"><p class="text-[15px] font-bold text-navy">' + esc(a.title) + '</p><p class="mt-1 text-[14px] text-mutedink">' + esc(a.body) + '</p></div>').join('')
        : empty('No notices from your team yet','Post your first team update above.')) + '</div>') : '');

  return nav() + header('Team captain panel', team.name + ' · captain control room',
      'Your team roster, entries, live score and the standings — everything you add is highlighted for the president to confirm.',
      '<a href="#/dashboard" class="' + BTN.ghost + '">Common dashboard</a><button type="button" data-action="captainLogout" class="' + BTN.dark + '">Log out</button>') +
  '<div class="mx-auto max-w-7xl px-5 py-8 lg:px-8"><div class="scroll-hide flex flex-wrap gap-2">' +

let introTimeline = null;
let introCleanup = null;

function initIntro() {
  const byId = (id) => document.getElementById(id);
  const gallery = byId('gallery');
  const showcaseContainer = byId('showcase-container');
  const logoCenter = byId('logo-center');
  const phaseText = byId('phase-text');
  const progressFill = byId('progress-fill');
  const animationStage = byId('animation-stage');
  const heroStage = byId('hero-stage');
  const typingText = byId('typing-text');
  const enterBtn = byId('enter-btn');
  const skipBtn = byId('skip-btn');
  const showcaseText = byId('showcase-text');
  const introScreen = byId('intro-screen');
  const campaignFootnote = byId('campaign-footnote');
  const heroScrollBtn = byId('hero-scroll-btn');
  const heroVideo = byId('hero-video');
  const likeBtn = byId('like-btn');
  const likeCount = byId('like-count');
  const gsap = window.gsap;
  const TextPlugin = window.TextPlugin;

  /* Likes (swap in a real database later — the helpers are already async) */
  const getLikes = async () => Number(await KV.get(LIKE_KEY, 0)) || 0;
  const addLike = async () => KV.set(LIKE_KEY, (await getLikes()) + 1);
  getLikes().then(n => { likeCount.textContent = n; });
  const onLike = () => { addLike().then(n => { likeCount.textContent = n; likeBtn.classList.add('liked'); }); };
  likeBtn.addEventListener('click', onLike);

  /* Build circle cards — every image used exactly once (no repeats) */
  const circleCards = [];
  for (let i = 0; i < CIRCLE_IMAGES.length; i++) {
    const card = document.createElement('div');
    card.className = 'px-card';
    const img = document.createElement('img');
    img.src = CIRCLE_IMAGES[i];
    img.alt = 'PIXELS 2k26';
    card.appendChild(img);
    gallery.appendChild(card);
    circleCards.push(card);
  }

  /* Build showcase cards: first is logo-style, rest are image cards */
  const showcaseCards = [];
  SHOWCASE_IMAGES.forEach((src, index) => {
    if (index === 0) {
      const card = document.createElement('div');
      card.className = 'showcase-logo-card';
      const circle = document.createElement('div');
      circle.className = 'showcase-logo-circle';
      const img = document.createElement('img');
      img.src = src; img.alt = 'PIXELS 2k26 Logo';
      circle.appendChild(img); card.appendChild(circle);
      showcaseContainer.appendChild(card); showcaseCards.push(card);
    } else {
      const card = document.createElement('div');
      card.className = 'showcase-card';
      const img = document.createElement('img');
      img.src = src; img.alt = SHOWCASE_LABELS[index];
      card.appendChild(img);
      showcaseContainer.appendChild(card); showcaseCards.push(card);
    }
  });

  /* Safety net if the animation library is unavailable */
  const revealHeroNow = () => {
    animationStage.style.display = 'none';
    skipBtn.style.display = 'none';
    heroStage.style.opacity = '1';
    heroStage.style.pointerEvents = 'auto';
    ['.hero-title', '.hero-tagline', '.hero-badge', '.hero-video-card', '.hero-credit'].forEach(sel => { const el = document.querySelector(sel); if (el) el.style.opacity = '1'; });
    typingText.textContent = INTRO_TYPE_TEXT; typingText.style.opacity = '1';
    campaignFootnote.style.opacity = '1';
  };

  let enterHandler = null, scrollHandler = null, visibilityHandler = null, clickHandler = null, keyHandler = null, touchHandler = null, stageScrollHandler = null, safety = null;
  const ambient = [];

  if (!gsap) {
    revealHeroNow();
    enterHandler = () => enterApp();
    enterBtn.addEventListener('click', enterHandler);
    introCleanup = () => { enterBtn.removeEventListener('click', enterHandler); };
    return;
  }

  if (TextPlugin) gsap.registerPlugin(TextPlugin);
  gsap.set('.logo-ring', { xPercent: -50, yPercent: -50 });
  gsap.set(logoCenter, { xPercent: -50, yPercent: -50, scale: 0, opacity: 0 });
  gsap.set('.showcase-card', { transformPerspective: 800 });

  const T = 0; // start immediately (no loading screen)
  const tl = gsap.timeline();
  introTimeline = tl;

  /* Phase: Initializing + cards materialize from depth */
  tl.to(phaseText, { opacity: 1, duration: .3 }, T + .3);
  tl.to(phaseText, { text: 'Initializing', duration: .4 }, T + .3);
  tl.set(circleCards, {
    x: () => (Math.random() - .5) * window.innerWidth * 1.8,
    y: () => (Math.random() - .5) * window.innerHeight * 1.8,
    z: () => (Math.random() - .5) * 1000,
    rotationX: () => Math.random() * 360,
    rotationY: () => Math.random() * 360,
    rotationZ: () => Math.random() * 180,
    opacity: 0, scale: .4
  });
  tl.to(circleCards, { opacity: 1, scale: 1, duration: 2.5, stagger: { each: .06, from: 'random' }, ease: 'power2.out' }, T + .5);
  tl.to(progressFill, { width: '15%', duration: 3.5, ease: 'power1.inOut' }, T);

  /* Phase: Aligning horizontally */
  tl.to(phaseText, { text: 'Aligning the Arenas', duration: .4 }, T + 3.5);
  const lineSpacing = window.innerWidth < 768 ? 50 : 78;
  tl.to(circleCards, {
    x: i => (i - (CIRCLE_IMAGES.length - 1) / 2) * lineSpacing,
    y: 0, z: 0, rotationX: 0, rotationY: 0, rotationZ: 0,
    duration: 2.5, stagger: { each: .04, from: 'center' }, ease: 'power3.inOut'
  }, T + 3.5);
  tl.to(progressFill, { width: '30%', duration: 2.5, ease: 'power1.inOut' }, T + 3.5);

  /* Phase: Forming the orbit */
  tl.to(phaseText, { text: 'Forming the Orbit', duration: .4 }, T + 6);
  const cR = window.innerWidth < 768 ? 140 : 240;
  tl.to(circleCards, {
    x: i => { const a = (i / CIRCLE_IMAGES.length) * Math.PI * 2 - Math.PI / 2; return Math.cos(a) * cR; },
    y: i => { const a = (i / CIRCLE_IMAGES.length) * Math.PI * 2 - Math.PI / 2; return Math.sin(a) * cR * .4; },
    z: i => { const a = (i / CIRCLE_IMAGES.length) * Math.PI * 2 - Math.PI / 2; return Math.sin(a) * cR * .5; },
    rotationY: i => -(i / CIRCLE_IMAGES.length) * 360,
    rotationX: -8, duration: 3, ease: 'expo.inOut'
  }, T + 6);
  tl.to(logoCenter, { opacity: 1, scale: 1, duration: 1.2, ease: 'back.out(1.7)' }, T + 7.5);
  tl.to(progressFill, { width: '50%', duration: 3, ease: 'power1.inOut' }, T + 6);
  tl.to(circleCards, { rotationY: i => -(i / CIRCLE_IMAGES.length) * 360 - 180, duration: 1.2, ease: 'power2.inOut' }, T + 9);

  /* Phase: Preparing showcase */
  tl.to(phaseText, { text: 'Showcasing the Arenas', duration: .4 }, T + 9);
  tl.to(circleCards, { opacity: 0, scale: .3, duration: .6, ease: 'power2.in', stagger: { each: .02, from: 'edges' } }, T + 10);
  tl.to(logoCenter, { opacity: 0, scale: .3, duration: .5, ease: 'power2.in' }, T + 10.1);
  tl.to(phaseText, { opacity: 0, duration: .3 }, T + 10.3);
  tl.to(progressFill, { width: '60%', duration: 1.5, ease: 'power1.inOut' }, T + 9);

  /* Showcase text */
  tl.to('#showcase-text', { opacity: 1, duration: .5, ease: 'power2.out' }, T + 10.5);
  tl.to('#showcase-text', { opacity: 0, duration: .4, ease: 'power2.in' }, T + 24.3);

  /* Showcase: 10 cards one by one */
  SHOWCASE_IMAGES.forEach((item, index) => {
    const card = showcaseCards[index];
    const start = T + 10.5 + index * 1.4;
    const flyOutDir = index % 2 === 0 ? -1 : 1;
    tl.to(phaseText, { opacity: 1, duration: .2 }, start);
    tl.to(phaseText, { text: SHOWCASE_LABELS[index], duration: .3 }, start);
    tl.fromTo(card,
      { x: 0, y: 0, z: -1500, rotationY: 220, rotationX: 20, opacity: 0, scale: .25 },
      { x: 0, y: 0, z: 0, rotationY: 0, rotationX: 0, opacity: 1, scale: 1, duration: .55, ease: 'back.out(1.4)' }, start);
    tl.to(card, { y: -8, rotationX: 3, duration: .3, ease: 'sine.inOut' }, start + .55);
    tl.to(card, { x: flyOutDir * window.innerWidth * .8, z: -1000, rotationY: flyOutDir * -120, rotationX: flyOutDir * 15, rotationZ: flyOutDir * 25, opacity: 0, scale: .4, duration: .4, ease: 'power3.in' }, start + .65);
    tl.to(phaseText, { opacity: 0, duration: .2 }, start + .8);
    tl.to(progressFill, { width: (60 + (index + 1) * 4) + '%', duration: 1, ease: 'power1.inOut' }, start);
  });

  /* Transition to hero */
  tl.set(skipBtn, { display: 'none' }, T + 25);
  tl.to(progressFill, { width: '100%', duration: .4, ease: 'power2.inOut' }, T + 24.5);
  tl.to(animationStage, { opacity: 0, duration: .5, ease: 'power2.inOut' }, T + 24.5);
  tl.set(animationStage, { display: 'none' }, T + 25);
  tl.to(heroStage, { opacity: 1, duration: .5, ease: 'power2.out' }, T + 24.5);
  tl.set(heroStage, { pointerEvents: 'auto' }, T + 25);

  /* Hero content reveal */
  tl.to('.hero-title', { opacity: 1, duration: .6, ease: 'power2.out' }, T + 25.2);
  tl.to('.hero-tagline', { opacity: 1, duration: .5, ease: 'power2.out' }, T + 25.6);
  tl.to(typingText, { opacity: 1, duration: .3 }, T + 26);
  tl.call(() => typingText.classList.add('typing'), null, T + 26);
  tl.to(typingText, { text: INTRO_TYPE_TEXT, duration: 3, ease: 'none' }, T + 26.2);
  tl.to('.hero-badge', { opacity: 1, duration: .5, ease: 'power2.out' }, T + 29);
  tl.to('#enter-btn', { opacity: 1, duration: .5, ease: 'back.out(1.4)' }, T + 29.5);
  tl.to('.hero-video-card', { opacity: 1, duration: .6, ease: 'power2.out' }, T + 26.5);
  tl.call(() => { introScreen.scrollTop = 0; playVisibleVideo(); startWithAudio(); }, null, T + 27.1);
  tl.to(campaignFootnote, { opacity: 1, duration: .6, ease: 'power2.out' }, T + 30.1);
  tl.to('#hero-credit', { opacity: 1, duration: .6, ease: 'power2.out' }, T + 30.4);

  /* Ambient loops */
  ambient.push(gsap.to('#enter-btn', { y: -6, duration: 1.5, repeat: -1, yoyo: true, ease: 'sine.inOut' }));
  ambient.push(gsap.to('.hero-video-card', { y: -8, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 27 }));

  /* Skip: jump straight to the hero stage */
  const skipToHero = () => { skipBtn.removeEventListener('click', skipToHero); tl.progress(1); };
  skipBtn.addEventListener('click', skipToHero);

  /* Mobile: floating scroll-down button scrolls to the video */
  scrollHandler = () => { const c = byId('hero-video-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  heroScrollBtn.addEventListener('click', scrollHandler);

  /* Mobile browsers allow muted autoplay; audio unlocks on a user gesture. */
  let soundEnabled = false, videoStarting = false;
  const videoIsVisible = () => {
    const rect = heroVideo.getBoundingClientRect();
    return getComputedStyle(heroStage).opacity !== '0' &&
      document.visibilityState === 'visible' && rect.bottom > 0 && rect.top < window.innerHeight;
  };
  function playVisibleVideo() {
    if (!videoIsVisible() || !heroVideo.paused || videoStarting) return;
    videoStarting = true;
    heroVideo.muted = !soundEnabled;
    heroVideo.play().catch(() => { heroVideo.muted = true; return heroVideo.play().catch(() => {}); }).finally(() => { videoStarting = false; });
  }
  const enableVideoSound = () => {
    if (soundEnabled) return;
    soundEnabled = true;
    heroVideo.muted = false;
    heroVideo.play().catch(() => { heroVideo.muted = true; playVisibleVideo(); });
  };
  /* Real audio: try unmuted playback straight away (allowed on most phones);
     if the browser blocks it we keep the muted autoplay running and unmute on
     the very first tap / click / key the student makes anywhere on the page. */
  const startWithAudio = () => {
    if (soundEnabled) return;
    heroVideo.volume = 1;
    heroVideo.muted = false;
    const playing = heroVideo.play();
    if (playing && playing.then) playing.then(() => { soundEnabled = true; }).catch(() => { heroVideo.muted = true; playVisibleVideo(); });
    else soundEnabled = true;
  };
  const onLoaded = () => { playVisibleVideo(); startWithAudio(); };
  heroVideo.addEventListener('loadeddata', onLoaded);
  heroVideo.addEventListener('canplay', onLoaded);
  const observer = new IntersectionObserver(entries => { if (entries.some(e => e.isIntersecting)) playVisibleVideo(); }, { threshold: 0.05 });
  observer.observe(heroVideo);
  stageScrollHandler = () => playVisibleVideo();
  heroStage.addEventListener('scroll', stageScrollHandler, { passive: true });
  visibilityHandler = () => playVisibleVideo();
  document.addEventListener('visibilitychange', visibilityHandler);
  clickHandler = () => enableVideoSound();
  touchHandler = () => enableVideoSound();
  keyHandler = () => enableVideoSound();
  window.addEventListener('click', clickHandler);
  window.addEventListener('touchend', touchHandler, { passive: true });
  window.addEventListener('keydown', keyHandler);

  /* Enter: fade the hero out, then open the landing page */
  enterHandler = () => {
    heroStage.style.transition = 'opacity .4s ease';
    heroStage.style.opacity = '0';
    setTimeout(() => enterApp(), 400);
  };
  enterBtn.addEventListener('click', enterHandler);

  /* Safety: if something stalls, jump straight to the hero stage after 30s */
  safety = setTimeout(() => { if (getComputedStyle(heroStage).opacity === '0') skipToHero(); }, 30000);

  introCleanup = () => {
    clearTimeout(safety);
    tl.kill();
    ambient.forEach(t => t.kill());
    observer.disconnect();
    skipBtn.removeEventListener('click', skipToHero);
    heroScrollBtn.removeEventListener('click', scrollHandler);
    heroVideo.removeEventListener('loadeddata', onLoaded);
    heroVideo.removeEventListener('canplay', onLoaded);
    heroStage.removeEventListener('scroll', stageScrollHandler);
    document.removeEventListener('visibilitychange', visibilityHandler);
    window.removeEventListener('click', clickHandler);
    window.removeEventListener('touchend', touchHandler);
    window.removeEventListener('keydown', keyHandler);
    enterBtn.removeEventListener('click', enterHandler);
    likeBtn.removeEventListener('click', onLike);
  };
}

function stopIntro() {
  if (introCleanup) { try { introCleanup(); } catch (e) {} introCleanup = null; }
  if (introTimeline) { introTimeline = null; }
}

function enterApp() {
  try { sessionStorage.setItem(KEYS.intro, '1'); } catch (e) {}
  state.entered = true;
  render();
}

function introDone() {
  if (state.entered) return true;
  try { return sessionStorage.getItem(KEYS.intro) === '1'; } catch (e) { return false; }
}

/* ============================== 13. ROUTER ============================== */
function view() {
  const r = state.route;
  if (!r[0] && !introDone()) return introView();
  if (!r[0]) return landing();
  switch (r[0]) {
    case 'dashboard': return dashboard();
    case 'journey': return journey();
    case 'events': return r[1] ? eventDetail(r[1]) : events();
    case 'teams': return r[1] ? teamDetail(r[1]) : teams();
    case 'gallery': return gallery();
    case 'feed': return feed();
    case 'announcements': return announcements();
    case 'admin': return admin();
    case 'captain': return captain();
    default: return nav() + '<main class="pb-44 pt-24"><div class="mx-auto max-w-3xl px-5">' + empty('Page not found','That page does not exist in PIXELS 2k26 — use the menu to find your way.') + '</div></main>' + tabbar();
  }
}
async function render() {
  state.route = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const showIntro = !state.route[0] && !introDone();
  state.data = await DB.all();
  if (!state.data.config.length) { await seed(); state.data = await DB.all(); }
  stopIntro(); /* only one intro timeline can ever be live */
  document.getElementById('app').innerHTML = view();
  window.scrollTo(0, 0);
  if (showIntro) initIntro(); else bindVideos();
}
function bindVideos() {
  document.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
}
const refresh = (flash) => { state.flash = flash || ''; render().then(() => { state.flash = ''; }); };

/* ============================== 14. THEME ============================== */
function setTheme(dark) {
  document.body.classList.toggle('theme-dark', dark);
  try { localStorage.setItem(KEYS.theme, dark ? 'dark' : 'light'); } catch (e) {}
}
function initTheme() {
  let saved = 'light';
  try { saved = localStorage.getItem(KEYS.theme) || 'light'; } catch (e) {}
  setTheme(saved === 'dark');
}

/* ============================== 15. ACTIONS ============================ */
const FORMS = {
  async register(data) {
    const ev = eventByName(data.event_name);
    await DB.create('registrations', { ...data, participants_count: num(data.participants_count) || 1, category: ev ? ev.category : '', status: 'registered' });
    localStorage.setItem(KEYS.student, JSON.stringify({ name: data.student_name, usn: data.usn, team: data.team }));
    refresh('Registration recorded');
  },
  async student(data) {
    localStorage.setItem(KEYS.student, JSON.stringify({ name: data.name, usn: data.usn, team: data.team }));
    refresh('Saved on this device');
  },
  async photo(data, form) {
    const file = form.querySelector('input[type="file"]').files[0];
    let url = data.image_url || '';
    if (file) url = await uploader.upload(file);
    if (!url) { alert('Add a photo or paste an image link.'); return; }
    await DB.create('posts', { image_url: url, caption: data.caption, uploader_name: data.uploader_name, uploader_usn: data.uploader_usn, team: data.team, venue: data.venue, likes: 0, approved: true });
    refresh('Photo added to the album');
  },
  async adminLogin(data) {
    if (data.password === (config().admin_password || 'revan2k26')) { localStorage.setItem(KEYS.admin, '1'); refresh(); }
    else { state.flash = 'Incorrect password — try again.'; render(); }
  },
  async captainLogin(data) {
    const t = state.data.teams.find(x => (x.captain_password || '').toUpperCase() === String(data.password || '').toUpperCase());
    if (t) { localStorage.setItem(KEYS.captain, t.name); refresh(); }
    else { state.flash = 'That password does not match any team. Ask the president for your team password.'; render(); }
  },
  async addTeam(data) {
    await DB.create('teams', { ...data, slug: String(data.name).toLowerCase().replace(/[^a-z0-9]+/g, '-'), total_points: 0, order_index: state.data.teams.length, captain_password: (String(data.name).slice(0, 3).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase()) });
    refresh('Team created');
  },
  async saveTeam(data, form) {
    await DB.update('teams', form.dataset.id, { ...data, total_points: num(data.total_points) });
    refresh('Team updated');
  },
  async addMember(data) {
    await DB.create('members', { ...data, role: 'member', status: 'confirmed', added_by: 'President' });
    refresh('Member added');
  },
  async addCategory(data) {
    await DB.create('categories', { ...data, slug: String(data.name).toLowerCase().replace(/[^a-z0-9]+/g, '-'), order_index: state.data.categories.length });
    refresh('Category added');
  },
  async publishEvent(data) {
    await DB.create('events', { ...data, points: num(data.points), order_index: state.data.events.length });
    refresh('Event published');
  },
  async saveEvent(data, form) {
    await DB.update('events', form.dataset.id, { ...data, points: num(data.points), participants_count: num(data.participants_count) });
    refresh('Event saved');
  },
  async publishResult(data) {
    const team = teamByName(data.first_team);
    await DB.create('results', { ...data, points_awarded: num(data.points_awarded) });
    if (team) await DB.update('teams', team.id, { total_points: num(team.total_points) + num(team.points) });
    const ev = eventByName(data.event_name);
    if (ev) await DB.update('events', ev.id, { status: 'completed', result_summary: data.first_team });
    refresh('Result published and points awarded');
  },
  async postAnnouncement(data) {
    await DB.create('announcements', { ...data, pinned: data.pinned === 'yes', author_name: 'President', author_role: 'admin', team: '' });
    refresh('Announcement published');
  },
  async captainMember(data) {
    await DB.create('members', { ...data, team: captainTeam(), role: 'member', status: 'pending', added_by: captainTeam() + ' captain' });
    refresh('Member added — waiting for the president to confirm');
  },
  async captainNotice(data) {
    await DB.create('announcements', { ...data, pinned: false, author_name: captainTeam() + ' captain', author_role: 'captain', team: captainTeam() });
    refresh('Notice published');
  },
  async saveSettings(data) {
    await DB.update('config', config().id, data);
    refresh('Settings saved');
  },
  async changePassword(data) {
    if (data.current !== (config().admin_password || 'revan2k26')) { state.flash = 'Current password is incorrect.'; render(); return; }
    if (!data.next || data.next !== data.confirm) { state.flash = 'New passwords do not match.'; render(); return; }
    await DB.update('config', config().id, { admin_password: data.next });
    refresh('Admin password updated');
  }
};
const ACTIONS = {
  async menu() { document.getElementById('drawer').classList.toggle('hidden'); },
  async install() {
    /* Once the Android build exists, APK_URL at the top of this file makes this
       button download the app instead of using the browser install prompt. */
    if (APK_URL) { window.location.href = APK_URL; return; }
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
    alert('To install: open ' + APP_URL + ' in Chrome on Android, tap the ⋮ menu, then choose “Install app” or “Add to Home screen”.');
  },
  async adminLogout() { localStorage.removeItem(KEYS.admin); refresh(); },
  async captainLogout() { localStorage.removeItem(KEYS.captain); refresh(); },
  async adminTab(el) { state.adminTab = el.dataset.value; render(); },
  async captainTab(el) { state.captainTab = el.dataset.value; render(); },
  async filter(el) { state.filterCat = el.dataset.value; render(); },
  async newPass(el) {
    const t = state.data.teams.find(x => x.id === el.dataset.id);
    await DB.update('teams', t.id, { captain_password: (t.name.slice(0, 3).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase()) });
    refresh('New captain password generated');
  },
  async removeTeam(el) { if (confirm('Delete this team?')) { await DB.remove('teams', el.dataset.id); refresh(); } },
  async removeMember(el) { await DB.remove('members', el.dataset.id); refresh(); },
  async confirmMember(el) { await DB.update('members', el.dataset.id, { status: 'confirmed' }); refresh('Member confirmed'); },
  async removeCategory(el) { await DB.remove('categories', el.dataset.id); refresh(); },
  async removeEvent(el) { if (confirm('Delete this event?')) { await DB.remove('events', el.dataset.id); refresh(); } },
  async eventStatus(el) { await DB.update('events', el.dataset.id, { status: el.dataset.value }); refresh(); },
  async removeResult(el) { await DB.remove('results', el.dataset.id); refresh(); },
  async regStatus(el) { await DB.update('registrations', el.dataset.id, { status: el.dataset.value }); refresh(); },
  async removeReg(el) { await DB.remove('registrations', el.dataset.id); refresh(); },
  async pinAnnouncement(el) {
    const a = state.data.announcements.find(x => x.id === el.dataset.id);
    await DB.update('announcements', a.id, { pinned: !a.pinned }); refresh();
  },
  async removeAnnouncement(el) { await DB.remove('announcements', el.dataset.id); refresh(); },
  async approvePost(el) {
    const p = state.data.posts.find(x => x.id === el.dataset.id);
    await DB.update('posts', p.id, { approved: !p.approved }); refresh();
  },
  async removePost(el) { await DB.remove('posts', el.dataset.id); refresh(); },
  async like(el) {
    const p = state.data.posts.find(x => x.id === el.dataset.id);
    await DB.update('posts', p.id, { likes: num(p.likes) + 1 }); refresh();
  }
};

/* ============================== 16. BOOT =============================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

document.addEventListener('click', (e) => {
  /* Theme toggle: switches instantly, no re-render */
  const themeEl = e.target.closest('[data-theme-toggle]');
  if (themeEl) { e.preventDefault(); setTheme(!isDark()); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el); }
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const fn = FORMS[form.dataset.form];
  if (fn) fn(data, form);
});
window.addEventListener('hashchange', render);

initTheme();
render();
</script>
</body>
